<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- cursive a: bowl + stem connecting forward -->
    <path d="M13 13 C 8 11, 6 19, 10 21 C 13 22, 14 18, 13 14 C 13 18, 13 21, 16 22"/>
    <!-- cursive b: tall ascender loop down into belly, connecting from a -->
    <path d="M16 22 C 18 20, 18 10, 16.5 8 C 16 13, 17 21, 19.5 22 C 24 23, 24 16, 20 16 C 18 16, 18 20, 21 21"/>
    <!-- signature underline flourish -->
    <path d="M7 26 C 13 24.5, 22 24.5, 27 26.5" stroke-width="1.6"/>
  </g>
</svg>
