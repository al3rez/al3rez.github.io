<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handwriter — Turn Text into Handwriting</title>
  <meta name="description" content="Handwriter turns typed text into natural handwritten pages in your browser. Export clean PNG handwriting for notes, assignments, and mockups.">
  <meta name="author" content="Alireza Bashiri">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://al3rez.com/handwriter/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="al3rez">
  <meta property="og:title" content="Handwriter — Turn Text into Handwriting">
  <meta property="og:description" content="Create natural handwritten pages from typed text right in your browser, then export as PNG.">
  <meta property="og:url" content="https://al3rez.com/handwriter/">
  <meta property="og:image" content="https://al3rez.com/handwriter/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Handwriter preview on lined paper">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Handwriter — Turn Text into Handwriting">
  <meta name="twitter:description" content="Create natural handwritten pages from typed text right in your browser, then export as PNG.">
  <meta name="twitter:image" content="https://al3rez.com/handwriter/og-image.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="editor">
    <canvas id="page"></canvas>
  </div>
  <textarea id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" tabindex="-1"></textarea>

  <div id="selection-tooltip" aria-hidden="true">
    <button id="btn-bold" title="Bold (Ctrl/⌘B)"><strong>B</strong></button>
    <button id="btn-strike" title="Strikethrough"><s>S</s></button>
  </div>

  <div id="toolbar">
    <button id="btn-download" title="Download as PNG">Export</button>
    <button id="btn-settings" title="Settings">Settings</button>
  </div>

  <div id="settings-panel" class="panel">
    <div class="panel-content">
      <div class="panel-header">
        <h2>Settings</h2>
        <button id="btn-close-settings" class="close-btn">&times;</button>
      </div>
      <label>Font Size: <span id="font-size-value">1.0</span>
        <input type="range" id="font-size" min="0.3" max="3.0" value="1.0" step="0.1">
      </label>
      <label>Line Spacing: <span id="line-spacing-value">34</span>px
        <input type="range" id="line-spacing" min="20" max="120" value="34" step="1">
      </label>
      <label>Text Color:
        <input type="color" id="text-color" value="#2c2c2e">
      </label>
      <label>Writing Style:
        <select id="writing-style">
          <option value="pen">Pen</option>
          <option value="pencil">Pencil</option>
          <option value="marker">Marker</option>
        </select>
      </label>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
