<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop id="s0" offset="0" stop-color="#0ea5e9"/>
      <stop id="s1" offset="0.55" stop-color="#6366f1"/>
      <stop id="s2" offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <style>
    /* light mode: deeper gradient so it stays visible on a white tab */
    @media (prefers-color-scheme: dark) {
      #s0 { stop-color: #7dd3fc; }
      #s1 { stop-color: #818cf8; }
      #s2 { stop-color: #ec4899; }
    }
    .ascii {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 700;
      font-size: 5px;
      fill: url(#ink);
      white-space: pre;
    }
  </style>
  <text class="ascii" xml:space="preserve"><tspan x="6.5" y="10">  ____ </tspan><tspan x="6.5" y="15"> / __ `</tspan><tspan x="6.5" y="20">/ /_/ /</tspan><tspan x="6.5" y="25">\__,_/ </tspan></text>
</svg>
